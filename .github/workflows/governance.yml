  #   runs-on: ubuntu-latest
  #   timeout-minutes: 10
  #   env:
  #     COMPLEXITY_PATTERN: "scripts/*.py"
  #     COMPLEXITY_THRESHOLD: "15"
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         persist-credentials: false
  #     - run: python3 scripts/check-cognitive-complexity.py --self-test
  #     - run: python3 scripts/check-cognitive-complexity.py --pattern "$COMPLEXITY_PATTERN" --threshold "$COMPLEXITY_THRESHOLD"
