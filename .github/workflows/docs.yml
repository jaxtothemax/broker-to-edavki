# ─── Documentation site and web app (Astro Starlight, apps/web → GitHub Pages) ─
#
# Five jobs after a detection step:
#
#   docs-internal-links  scripts/check-docs-internal-links.py — a broken
#                        internal link, cross-page/same-page anchor, relative
#                        asset, or cross-repository "source of record" link
#                        under DOCS_ROOT fails the run. See that script's module
#                        docstring for what is configurable here versus
#                        hard-coded to the Astro Starlight shape.
#   base-path            decides where the site is served, ONCE, for the docs
#                        and for the web app, and hands it to the jobs below as
#                        outputs. The only job with `pages: read`.
#   web-app              installs, builds and checks the web app with
#                        `contents: read` only, on every run (pull requests
#                        too), and uploads the build as the workflow artifact
#                        `web-app`. See "The web app" below.
#   website-build        compiles and VERIFIES the docs site, adds the web app
#                        only when PUBLISH_WEB_APP is "true", then uploads the
#                        Pages artifact (on PRs too, so the artifact a PR would
#                        publish is inspectable). It never installs or runs the
#                        web app's toolchain.
#   pages                publishes that already-verified artifact from main,
#                        without rebuilding
#
#   detect ─┬─ docs-internal-links
#           └─ base-path ── web-app ── website-build ── pages (push to main only)
#
# A green `astro build` is not proof the docs rendered — Starlight's content
# loader catches a per-page render error, drops that page's whole body, and
# still exits 0. The verification step in website-build is what actually proves
# something: every source page must have produced an output file, and that file
# must be larger than a bare-chrome shell.
#
# No docs site, no docs jobs. `detect` decides: a clone with no DOCS_CONFIG
# skips docs-internal-links, and one with no website/package.json skips
# base-path, web-app, the build and the deploy — skipped, not failed, and not a
# green no-op that claims to have checked something. Checked against DOCS_CONFIG
# specifically (not DOCS_ROOT) because a content directory can exist
# mid-migration with no working config; the config file is what says "this docs
# site is wired up." The Makefile's check-docs-links target mirrors the same
# test locally.
#
# Customize (only needed if your docs site does not use the recommended shape —
# website/src/content/docs, built with Astro Starlight):
#   - DOCS_ROOT:   content root, repo-relative
#   - DOCS_CONFIG: framework config read for `redirects:` + the site's own base
#                  URL; also the detection marker — see the script's
#                  --docs-root/--config flags for a framework with a different
#                  config file name entirely.
#
# One-time repository setting: Settings → Pages → Source = "GitHub Actions".
# A project site is served at https://<owner>.github.io/<repo>/ unless a custom
# domain is set. base-path reads the real origin and base path from
# actions/configure-pages; website-build passes them to the docs build as
# SITE_URL and BASE_PATH (see website/astro.config.mjs), and web-app builds the
# app under the same base followed by app/, so no file hardcodes the repository
# name. configure-pages runs only on pushes to main (the only builds that
# deploy), because it fails until the setting above is made; pull-request
# builds use the default project-site origin and /<repo> base instead, which is
# all a build check needs.
#
# The web app (apps/web, ADR 0009). web-app builds it on every run with its
# public path set to the docs base followed by app/ (/<repo>/app/ on a project
# site, /app/ on a custom domain), and apps/web/scripts/pages-build/
# check-pages-build.mjs fails the job if the build's Content Security Policy meta
# tag is missing, not first in <head> or not the policy vite.config.ts injects,
# or the build references a script or stylesheet outside that path, or has an
# inline script.
#
# Publishing is OFF until the repository variable PUBLISH_WEB_APP equals "true"
# (Settings -> Secrets and variables -> Actions -> Variables). Only then does
# website-build download the app, check it again and copy it under app/, and
# the docs sidebar link it (website/astro.config.mjs), so the link and its page
# appear together. The pages job deploys that artifact on pushes to main, so
# setting the variable is the whole opt-in; unset it and the next push removes
# the app again. Issue #70 lists what must be true before it is set.
#
# Why the app is built in a job of its own: its toolchain (Vite, Rolldown, the
# React plugin and what they pull in) is the largest body of third-party code
# this workflow runs, and code that runs in a job can tamper with every later
# step of that job. So it runs in web-app, whose token can only read the
# repository and which has no step that builds, uploads or deploys the Pages
# artifact. website-build never installs it: it takes the built app only as a
# downloaded artifact, refuses anything in it that is not a regular file or a
# directory, and re-runs the checker from its own checkout (the verifier is the
# repository's script, never anything from the artifact) before copying the
# files under app/. What the split does not cover: compromised build code still
# writes the app's own files, so a script it hides inside a bundle the policy
# allows passes every check here and is published with the app. It cannot
# reach the docs pages, the steps that build and upload the Pages artifact, or
# the deploy.

name: docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  DOCS_ROOT: "website/src/content/docs"
  DOCS_CONFIG: "website/astro.config.mjs"

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      config: ${{ steps.detect.outputs.config }}
      site: ${{ steps.detect.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: detect
        run: |
          if [ -f "$DOCS_CONFIG" ]; then echo "config=true" >> "$GITHUB_OUTPUT"; else
            echo "config=false" >> "$GITHUB_OUTPUT"
            echo "No docs config ($DOCS_CONFIG) — docs-internal-links will be skipped."
          fi
          if [ -f website/package.json ]; then echo "site=true" >> "$GITHUB_OUTPUT"; else
            echo "site=false" >> "$GITHUB_OUTPUT"
            echo "No website/package.json — base-path, web-app, website-build and pages will be skipped."
          fi

  docs-internal-links:
    needs: detect
    if: needs.detect.outputs.config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Self-test FIRST, in this same job — check-gate-selftest-parity.sh
      # requires it, and scripts/CLAUDE.md explains why "ran in a different
      # job" is worth nothing: it proves the check works on a different runner.
      - run: python3 scripts/check-docs-internal-links.py --self-test
      - run: python3 scripts/check-docs-internal-links.py --docs-root "$DOCS_ROOT" --config "$DOCS_CONFIG"

  base-path:
    needs: detect
    if: needs.detect.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # configure-pages reads the Pages site through GET /repos/{owner}/{repo}/pages,
    # which needs `pages: read`. A job-level block replaces the workflow default,
    # so `contents: read` is listed again: the pair configure-pages already ran
    # with on main, moved here from website-build, which now runs with the
    # workflow default alone.
    permissions:
      contents: read
      pages: read
    outputs:
      site: ${{ steps.base.outputs.site }}
      docs: ${{ steps.base.outputs.docs }}
      app: ${{ steps.base.outputs.app }}
    steps:
      # origin: "https://<owner>.github.io" (or the custom domain);
      # base_path: "/<repo>", or "" when the site is served at the root.
      - id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The base path is decided in ONE place, for the docs and for the web app,
      # so the two cannot disagree. configure-pages reports base_path "" when the
      # site is served at the root (a custom domain or a user site), and
      # `outputs.base_path || fallback` reads that "" as "not set" and falls back
      # to /<repo>, which 404s every asset. So this keys on whether configure-pages
      # RAN (it is skipped on pull requests), not on the value it returned. For
      # this repository's project site both paths give /<repo>.
      #   site: the origin, as configure-pages reports it, else the default
      #         project-site origin
      #   docs: "" or "/<repo>", as configure-pages reports it
      #   app:  where the web app lives, "/app/" or "/<repo>/app/"
      # Expressions are resolved into env vars, never into the script itself.
      - id: base
        env:
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          FALLBACK_ORIGIN: ${{ format('https://{0}.github.io', github.repository_owner) }}
          FALLBACK_BASE_PATH: ${{ format('/{0}', github.event.repository.name) }}
        run: |
          if [ "$PAGES_OUTCOME" = "success" ]; then
            docs_base="$PAGES_BASE_PATH"
          else
            docs_base="$FALLBACK_BASE_PATH"
          fi
          site="${PAGES_ORIGIN:-$FALLBACK_ORIGIN}"
          trimmed="$docs_base"
          while [ "${trimmed#/}" != "$trimmed" ]; do trimmed="${trimmed#/}"; done
          while [ "${trimmed%/}" != "$trimmed" ]; do trimmed="${trimmed%/}"; done
          if [ -n "$trimmed" ]; then app_base="/${trimmed}/app/"; else app_base="/app/"; fi
          {
            printf 'site=%s\n' "$site"
            printf 'docs=%s\n' "$docs_base"
            printf 'app=%s\n' "$app_base"
          } >> "$GITHUB_OUTPUT"
          echo "site: '${site}'; docs base path: '${docs_base}'; web app public path: '${app_base}'"

  # ── The web app (apps/web, ADR 0009) ───────────────────────────────────────
  # Built and checked on EVERY run, pull requests included, so a wrong base
  # path or a lost Content Security Policy is red in the PR that causes it.
  # Whatever runs here is treated as untrusted by website-build; see "Why the
  # app is built in a job of its own" at the top of this file.
  web-app:
    needs: [detect, base-path]
    if: needs.detect.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read the repository, and nothing else: no `pages`, no `id-token`.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Only apps/web and the workspace packages it imports. Vite bundles those
      # from their TypeScript sources, so no package build is needed first.
      - name: Install the workspace packages apps/web needs
        run: pnpm install --frozen-lockfile --filter "@taxreporter/web..."
      - name: Build the web app
        env:
          TAXREPORTER_WEB_BASE: ${{ needs.base-path.outputs.app }}
        run: pnpm --filter @taxreporter/web build
      # Self-test first, in this same job (scripts/CLAUDE.md), then the real check.
      - name: Check the web app build for Pages
        env:
          WEB_BASE: ${{ needs.base-path.outputs.app }}
        run: |
          node apps/web/scripts/pages-build/check-pages-build.mjs --self-test
          node apps/web/scripts/pages-build/check-pages-build.mjs apps/web/dist "$WEB_BASE"
      # upload-artifact follows symbolic links, and upload-pages-artifact
      # archives with `tar --dereference`, so a link in the build would put
      # whatever it points at into the artifact and then the public site. Vite
      # writes only regular files and directories, so anything else fails here,
      # on every run (a pull request shows it). website-build checks again.
      - name: Refuse anything in the build that is not a file or a directory
        run: |
          odd="$(find apps/web/dist ! -type f ! -type d)"
          if [ -n "$odd" ]; then
            echo "::error::apps/web/dist holds entries that are neither regular files nor directories; refusing to hand it on:"
            find apps/web/dist ! -type f ! -type d -exec printf '  %q\n' {} \;
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-app
          path: apps/web/dist
          retention-days: 7
          if-no-files-found: error

  website-build:
    needs: [detect, base-path, web-app]
    if: needs.detect.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The workflow default, `contents: read`: the Pages lookup is base-path's.
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # PUBLISH_WEB_APP must be a repository or organization variable: this job
      # has no `environment:`, so a variable set on the github-pages environment
      # is invisible here. It is read through env, never interpolated into the
      # script. Unset, empty or anything but "true" leaves the artifact alone.
      # This step is the one decision: the docs build (for the sidebar link), the
      # download, the check and the copy below all read its output.
      - name: Decide whether the web app joins the Pages artifact
        id: publish
        env:
          PUBLISH_WEB_APP: ${{ vars.PUBLISH_WEB_APP }}
        run: |
          if [ "${PUBLISH_WEB_APP:-}" != "true" ]; then
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "PUBLISH_WEB_APP is not \"true\": the web app is built and checked (job web-app) but is NOT in the Pages artifact."
            exit 0
          fi
          echo "app=true" >> "$GITHUB_OUTPUT"
          echo "PUBLISH_WEB_APP is \"true\": the web app joins the Pages artifact under app/."
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      # ── The web app, only when PUBLISH_WEB_APP is "true" ───────────────────
      # Downloaded outside the checkout (runner.temp), so nothing from it lands
      # in website/ or next to the scripts that check it.
      - name: Download the web app that web-app built
        if: steps.publish.outputs.app == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-app
          path: ${{ runner.temp }}/web-app
      # The artifact is not trusted; this job's checkout is. So the checker that
      # runs here is the repository's own script, self-tested first in this job
      # (scripts/CLAUDE.md), and it reads the downloaded files without running
      # them. Entry names are not printed: they come from the artifact.
      - name: Check the downloaded web app again
        if: steps.publish.outputs.app == 'true'
        working-directory: .
        env:
          WEB_APP_DIR: ${{ runner.temp }}/web-app
          WEB_BASE: ${{ needs.base-path.outputs.app }}
        run: |
          odd="$(find "$WEB_APP_DIR" ! -type f ! -type d)"
          if [ -n "$odd" ]; then
            echo "::error::the downloaded web app holds entries that are neither regular files nor directories (job web-app lists them); refusing to publish it."
            exit 1
          fi
          node apps/web/scripts/pages-build/check-pages-build.mjs --self-test
          node apps/web/scripts/pages-build/check-pages-build.mjs "$WEB_APP_DIR" "$WEB_BASE"
      # ── The documentation site ─────────────────────────────────────────────
      - run: npm ci
      # astro build empties its output directory, but not completely: Astro's
      # emptyDir is passed new Set(".git"), a set of the characters ".", "g", "i"
      # and "t", so a top-level entry with one of those names survives it. So the
      # build does not rely on it: nothing before this point writes website/dist,
      # and if anything did, the job stops here instead of publishing it.
      - name: Refuse a website/dist that the docs build did not write
        run: |
          if [ -e dist ] || [ -L dist ]; then
            echo "::error::website/dist exists before the docs build, so an earlier step wrote it; refusing to build the Pages artifact on top of it."
            exit 1
          fi
      - run: npm run build
        env:
          SITE_URL: ${{ needs.base-path.outputs.site }}
          BASE_PATH: ${{ needs.base-path.outputs.docs }}
          # "true" adds the sidebar link to the app (website/astro.config.mjs).
          PUBLISH_WEB_APP: ${{ steps.publish.outputs.app }}
      - name: Verify every source page rendered
        run: |
          MIN_BYTES=2000
          failures="$(mktemp)"
          find src/content/docs -type f \( -name '*.md' -o -name '*.mdx' \) | while IFS= read -r src; do
            rel="${src#src/content/docs/}"
            rel="${rel%.mdx}"
            rel="${rel%.md}"
            if [ "$rel" = "index" ]; then
              out="dist/index.html"
            else
              out="dist/${rel}/index.html"
            fi
            if [ ! -f "$out" ]; then
              echo "MISSING build output for $src -> $out"
              echo x >> "$failures"
              continue
            fi
            bytes=$(wc -c < "$out")
            if [ "$bytes" -lt "$MIN_BYTES" ]; then
              echo "SUSPICIOUSLY SMALL ($bytes bytes, expected >= $MIN_BYTES) — $out (from $src)"
              echo x >> "$failures"
            fi
          done
          if [ -s "$failures" ]; then
            echo "Docs build verification FAILED — see missing/undersized pages above."
            exit 1
          fi
          echo "Docs build verification passed: every source page rendered a non-trivial output file."
      # The app goes under the docs base followed by app/ (/<repo>/app/ on a
      # project site, /app/ on a custom domain). The copy never follows links
      # (cp -P), and the check above refused any.
      - name: Add the web app to the Pages artifact
        if: steps.publish.outputs.app == 'true'
        working-directory: .
        env:
          WEB_APP_DIR: ${{ runner.temp }}/web-app
        run: |
          if [ -e website/dist/app ] || [ -L website/dist/app ]; then
            echo "::error::website/dist/app already exists (a docs page at /app/?); refusing to overwrite it."
            exit 1
          fi
          mkdir website/dist/app
          cp -R -P "$WEB_APP_DIR"/. website/dist/app/
          test -s website/dist/app/index.html
          echo "The web app is in the Pages artifact under app/."
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist
          retention-days: 7

  pages:
    needs: website-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time, and never cancel one mid-flight: a half-finished
    # Pages deployment is worse than a late one.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
